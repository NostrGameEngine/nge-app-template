
import java.util.Properties

pluginManagement {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url = uri("https://teavm.org/maven/repository") }
        maven { url = uri("https://maven.ngengine.org/riccardobl/teavm") }
    }
    plugins {
        id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0"
        id("com.android.application") version '8.12.2' apply false
        id("com.android.library") version '8.12.2' apply false
        id("org.jetbrains.kotlin.android") version "2.1.20" apply false
    }
}



plugins {
    id("org.gradle.toolchains.foojay-resolver") version "1.0.0"
}

toolchainManagement {
    jvm {
        javaRepositories {
            repository("foojay") {
                resolverClass = org.gradle.toolchains.foojay.FoojayToolchainResolver
            }
        }
    }
}

dependencyResolutionManagement {
    repositories {
        exclusiveContent {
            forRepository {
                mavenLocal()
            }
            filter {
                includeVersionByRegex("org\\.ngengine", ".*", "0\\.2\\.0-SNAPSHOT")
            }
        }
        maven {
            name = "MavenLocalDirect"
            url = uri("${System.getProperty('user.home')}/.m2/repository")
            metadataSources {
                mavenPom()
                artifact()
            }
        }
        mavenCentral()
        google()
        maven {
            url = uri("https://central.sonatype.com/repository/maven-snapshots")
        }
        maven { url = uri("https://teavm.org/maven/repository") }
        maven { url = uri("https://maven.ngengine.org/riccardobl/teavm") }
        ivy {
            name = "Node.js"
            setUrl("https://nodejs.org/dist/")
            patternLayout {
                artifact("v[revision]/[artifact](-v[revision]-[classifier]).[ext]")
            }
            metadataSources {
                artifact()
            }
            content {
                includeModule("org.nodejs", "node")
            }
        }
    }
}


if (!gradle.hasProperty('ext')) {
    gradle.ext {}
}

def templateProperties = new Properties()
def templatePropertiesFile = file("${rootDir}/gradle.properties")
if (templatePropertiesFile.isFile()) {
    templatePropertiesFile.withInputStream { templateProperties.load(it) }
}

gradle.beforeProject { p ->
    if (p == p.rootProject) {
        p.tasks.register("cleanDist", org.gradle.api.tasks.Delete) {
            delete p.layout.projectDirectory.dir("dist")
        }
        p.gradle.projectsEvaluated {
            def cleanTask = p.tasks.findByName("clean") ?: p.tasks.register("clean")
            cleanTask.configure { dependsOn("cleanDist") }
        }
    }
}

// import json properties
apply from: "${rootDir}/gradle/libs/props.gradle"
def ngeConfig = gradle.ext.loadNgeAppProperties("${rootDir}/app/src/main/resources/ngeapp.json")
gradle.beforeProject { p ->
    ngeConfig.each { k, v -> p.ext.set(k, v) }
    if (ngeConfig.Version)   p.version = ngeConfig.Version.toString()
    if (ngeConfig.Namespace) p.group   = ngeConfig.Namespace.toString()
}

println("Build with config: " + ngeConfig)
rootProject.name = ngeConfig.ShortName
include('app')

// ENABLE DESKTOP BUILD TARGET
include('platform-desktop')

// ENABLE WEB BUILD TARGET
include('platform-web')

def requestedAndroidCompileSdk = (templateProperties.getProperty('androidCompileSdk') ?: '36') as int
def androidSdkCandidates = [] as LinkedHashSet<File>
def addAndroidSdkCandidate = { Object path ->
    if (path != null && path.toString().trim()) {
        androidSdkCandidates << file(path.toString().trim())
    }
}

def localPropertiesFile = file("${rootDir}/local.properties")
if (localPropertiesFile.isFile()) {
    def localProperties = new Properties()
    localPropertiesFile.withInputStream { localProperties.load(it) }
    addAndroidSdkCandidate(localProperties.getProperty('sdk.dir'))
}
addAndroidSdkCandidate(templateProperties.getProperty('android.sdk.path'))
addAndroidSdkCandidate(System.getenv('ANDROID_HOME'))
addAndroidSdkCandidate(System.getenv('ANDROID_SDK_ROOT'))
addAndroidSdkCandidate("${System.getProperty('user.home')}/Android/Sdk")
addAndroidSdkCandidate("${System.getProperty('user.home')}/Library/Android/sdk")
addAndroidSdkCandidate("${System.getProperty('user.home')}/AppData/Local/Android/Sdk")

def androidSdkDir = androidSdkCandidates.find { candidate ->
    new File(candidate, "platforms/android-${requestedAndroidCompileSdk}/android.jar").isFile()
}

if (androidSdkDir != null) {
    gradle.ext.androidSdkDir = androidSdkDir.absolutePath
    gradle.ext.androidCompileSdk = requestedAndroidCompileSdk
    System.setProperty('android.home', androidSdkDir.absolutePath)
    println("Including platform-android with Android SDK ${requestedAndroidCompileSdk} at ${androidSdkDir}")
    include('platform-android')
} else {
    println("Skipping platform-android: Android SDK platform android-${requestedAndroidCompileSdk} was not found")
}

if (System.getProperty('os.name', '').toLowerCase().contains('mac')) {
    println("Including platform-ios on macOS")
    include('platform-ios')
} else {
    println("Skipping platform-ios: iOS builds are only available on macOS")
}
